name: Site checks
# Builds the site and checks for broken links, stale data and pages that break on phones.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '30 3 * * *' }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        run: SKIP_IMG=1 node build.mjs
      - name: Chronology register
        run: node scripts/check_chronology.mjs
      - name: Editorial research source checks
        run: node scripts/check_editorial_research.mjs
      - name: Commute model and Python reproduction
        run: |
          node scripts/check_getting_to_work.mjs
          node --check src/getting-to-work.js
          python -m py_compile scripts/getting_to_work_analysis.py
          python scripts/getting_to_work_analysis.py static/research/getting-to-work/field-template.csv --output /tmp/gw-results.csv
      - name: Historical reading-path source and arithmetic checks
        run: |
          node scripts/check_four_labs.mjs
          node --check src/china-inputs.js
          node --check src/thali.js
          node --check src/dollar-cushion.js
      - name: Annual economic outcome evidence checks
        run: |
          node scripts/check_outcomes.mjs
          node --check src/outcomes.js
      - name: Historical 52-week archive source integrity
        run: |
          node scripts/check_oil_weekly.mjs
          node --check src/oil-weekly.js
      - name: Canonical annual flagship integration
        run: node scripts/check_annual_flagship.mjs
      - name: RBI FCNR and net-financing source checks
        run: |
          node scripts/check_fcnr_financing.mjs
          node --check src/fcnr-2026.js
      - name: Links and freshness
        run: node scripts/check_site.mjs dist --strict
      - name: Phones
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          (python -m http.server 8811 -d dist >/dev/null 2>&1 &) && sleep 2
          python scripts/check_mobile.py http://localhost:8811
