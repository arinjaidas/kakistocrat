name: Refresh market and commodity data
on:
  schedule:
    - cron: '35 12 * * 1-5'   # 18:05 IST, after NSE publishes closing files
    - cron: '35 15 * * 1-5'   # 21:05 IST, catch late files
    - cron: '17 14 * * 1-5'   # 19:47 IST, extra run in case GitHub skips one
    - cron: '43 2 * * 2-6'    # 08:13 IST next morning, last catch-up
    - cron: '52 6 * * 1-5'    # 12:22 IST, midday: picks up morning releases (CPI, IIP, WPI days) and covers a skipped night run
    - cron: '28 17 * * 1-5'   # 22:58 IST, another late slot: GitHub can start scheduled runs hours late or skip them
    - cron: '20 3 * * 0'      # Sunday: weekly refresh for monthly series
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: markets, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl xlrd matplotlib
      - run: python scripts/fetch_markets.py --years 3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Save today's Daily Desk
        run: SKIP_IMG=1 node build.mjs >/dev/null || echo "build failed; desk not saved"
      - name: Post new releases to Telegram (only if the owner has added the secrets)
        run: python3 scripts/notify.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit if data changed
        run: |
          for p in data/markets data/desk data/ogd data/repo_history.json data/notified.json; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "kakistocrat-data"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh market data"
          git pull --rebase --autostash origin main
          git push
